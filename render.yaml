services:
  - type: web
    name: ustidnr-mcp
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: "8000"
      - key: LOG_LEVEL
        value: INFO

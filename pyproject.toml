[project]
name = "ustidnr-mcp"
version = "0.1.0"
description = "MCP server for EU VAT ID validation (USt-IdNr) via BZSt eVatR API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tim Loehr" }]
keywords = [
    "ust-idnr",
    "vat-id",
    "umsatzsteuer",
    "bzst",
    "evatr",
    "vies",
    "mcp",
    "german",
    "tax",
    "compliance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp[cli]>=1.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "defusedxml>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/Mavengence/ustidnr-mcp"
Repository = "https://github.com/Mavengence/ustidnr-mcp"
Issues = "https://github.com/Mavengence/ustidnr-mcp/issues"
Changelog = "https://github.com/Mavengence/ustidnr-mcp/blob/main/CHANGELOG.md"

[project.scripts]
ustidnr-mcp = "ustidnr_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ustidnr_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "src/ustidnr_mcp/server.py",
    "src/ustidnr_mcp/__main__.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["defusedxml.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ustidnr_mcp.server"]
disable_error_code = ["type-arg"]
disallow_untyped_defs = false
warn_return_any = false
